name: Publish

# Trusted publishing: npm exchanges the GitHub OIDC token. No npm token.
# The publisher configured on npmjs.com must name this file publish.yml.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # target_commitish stays on the default branch once the tag exists,
      # so check that the tagged commit is actually contained in main.
      - name: Require the tagged commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit ${GITHUB_SHA} is not on main"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      # Every package has the same version; scripts/version.ts fails if not.
      - name: Require the tag to match the packages' version
        run: |
          version=$(bun scripts/version.ts)
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the packages' version v${version}"
            exit 1
          fi
      # bun pm pack builds each package and turns its catalog: and workspace:
      # ranges into plain versions, which npm publish would leave as they are.
      # npm publishes the tarball, so trusted publishing still applies.
      # @hinote/types goes first because hinote depends on it, and a package
      # npm already has at this version is skipped, so a rerun can finish.
      - name: Publish every package
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          for dir in packages/types packages/code packages/katex packages/d2 packages/hinote; do
            name=$(jq -r .name "$dir/package.json")
            version=$(jq -r .version "$dir/package.json")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published"
              continue
            fi
            tarball="$RUNNER_TEMP/packs/$(basename "$dir").tgz"
            (cd "$dir" && bun pm pack --filename "$tarball" --quiet)
            npm publish "$tarball" --access public
          done

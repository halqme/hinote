name: Publish

# Trusted publishing: npm exchanges the GitHub OIDC token. No npm token.
# The publisher configured on npmjs.com must name this file publish.yml.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # target_commitish stays on the default branch once the tag exists,
      # so check that the tagged commit is actually contained in main.
      - name: Require the tagged commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit ${GITHUB_SHA} is not on main"
            exit 1
          fi
      - name: Require the tag to match package.json
        run: |
          version=$(jq -r .version packages/hinote/package.json)
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match packages/hinote/package.json version v${version}"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      # hinote depends on @hinote/types, so the scoped packages go out first.
      # Each one is published only when npm does not have its version yet.
      - name: Publish the @hinote/* packages whose version is new
        run: |
          for dir in packages/types packages/code packages/katex; do
            name=$(jq -r .name "$dir/package.json")
            version=$(jq -r .version "$dir/package.json")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published"
            else
              (cd "$dir" && npm publish)
            fi
          done
      - run: npm publish
        working-directory: packages/hinote

name: Publish

# Trusted publishing: npm exchanges the GitHub OIDC token. No npm token.
# The publisher configured on npmjs.com must name this file publish.yml.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # target_commitish stays on the default branch once the tag exists,
      # so check that the tagged commit is actually contained in main.
      - name: Require the tagged commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit ${GITHUB_SHA} is not on main"
            exit 1
          fi
      - name: Require the tag to match package.json
        run: |
          version=$(jq -r .version packages/hinote/package.json)
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match packages/hinote/package.json version v${version}"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      # hinote depends on @hinote/types, so a new version of it goes out first.
      # A version already on npm is left alone.
      - name: Publish @hinote/types when its version is new
        working-directory: packages/types
        run: |
          version=$(jq -r .version package.json)
          if npm view "@hinote/types@${version}" version >/dev/null 2>&1; then
            echo "@hinote/types@${version} is already published"
          else
            npm publish
          fi
      - run: npm publish
        working-directory: packages/hinote

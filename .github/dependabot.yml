# Every update, for the packages and for the CI actions, comes in one pull
# request a week. bench/ is left out: it pins each tool at the version the
# comparison measured.
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "bun"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
